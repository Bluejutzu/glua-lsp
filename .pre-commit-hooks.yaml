# Hooks for https://pre-commit.com. Point a project's .pre-commit-config.yaml
# at this repo to run glua as part of `git commit`:
#
#   repos:
#     - repo: https://github.com/Bluejutzu/glua-lsp
#       rev: v0.5.4   # a tag from this repo; see the Releases page for the latest
#       hooks:
#         - id: glua-lint
#         - id: glua-fmt
#
# Neither hook needs Node or glua-cli installed locally — pre-commit installs
# glua-cli itself, in its own isolated environment, the first time the hook
# runs. `rev` pins the hook definition below, not the version of glua-cli that
# gets installed; add `additional_dependencies: ['glua-cli@0.5.4']` under a
# hook to pin that too.
#
# Both hooks index the whole project even when only a few files changed,
# exactly like `glua lint`/`glua fmt` run by hand — cross-file rules need the
# whole picture, and the fact cache is what keeps a partial commit cheap.

- id: glua-lint
  name: glua lint
  description: Report problems in staged Garry's Mod Lua files.
  entry: glua lint --no-progress
  language: node
  additional_dependencies: ['glua-cli']
  files: \.(lua|glua)$

- id: glua-fmt
  name: glua fmt
  description: Format staged Garry's Mod Lua files.
  entry: glua fmt --write --no-progress
  language: node
  additional_dependencies: ['glua-cli']
  files: \.(lua|glua)$
