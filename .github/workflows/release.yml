name: Release

on:
  push:
    tags: ['glua-gmod@*', 'glua-cli@*']
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to build (workflow_dispatch only)'
        type: choice
        options: [glua-gmod, glua-cli]
        default: glua-gmod
      dry_run:
        description: 'Build and package without creating a release'
        type: boolean
        default: true

permissions:
  contents: write
  # npm trusted publishing authenticates over OIDC instead of a stored token.
  id-token: write

jobs:
  release-lsp:
    name: Build and publish glua-gmod
    if: startsWith(github.ref, 'refs/tags/glua-gmod@') || (github.event_name == 'workflow_dispatch' && inputs.package == 'glua-gmod')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to generate release notes from the commits since last tag.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A tag that disagrees with the manifest produces a release whose
      # filename and contents do not match its name. Fail early instead.
      #
      # The version is the tag with its `glua-gmod@` prefix stripped, NOT
      # the raw ref name — the package name itself contains a hyphen, so
      # checking the whole ref for "-" to detect a prerelease would always
      # match.
      - name: Check the tag matches the manifest version
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest=$(node -p "require('./packages/glua-lsp/package.json').version")
          version="${GITHUB_REF_NAME#glua-gmod@}"
          echo "manifest=$manifest tag=$version"
          if [ "$manifest" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $manifest."
            echo "::error::Bump the version in packages/glua-lsp/package.json, or retag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        run: pnpm run typecheck

      # Before the tests: the CLI's tests exercise its built bundle, and both
      # packages build from glua-core, so everything builds regardless of
      # which one is being released.
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
        env:
          FORCE_COLOR: '1'

      - name: Package
        run: pnpm run package

      - name: Resolve artifact
        id: artifact
        run: |
          # Name it explicitly rather than globbing: a stray .vsix in the tree
          # would otherwise be picked up and published in place of the build.
          version=$(node -p "require('./packages/glua-lsp/package.json').version")
          vsix="packages/glua-lsp/glua-gmod-${version}.vsix"
          if [ ! -f "$vsix" ]; then
            echo "::error::Expected $vsix, but packaging did not produce it."
            ls -la packages/glua-lsp/*.vsix || true
            exit 1
          fi
          echo "path=$vsix" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$vsix")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$vsix" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: ${{ steps.artifact.outputs.name }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'glua-gmod@*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          # Scoped to commits touching this package or the shared engine —
          # a glua-cli-only commit has nothing to do with this release.
          if [ -n "$previous" ]; then
            range="${previous}..${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
          fi
          shas=$(git log "$range" --no-merges --format='%H' -- packages/glua-lsp packages/glua-core)

          changes=""
          for sha in $shas; do
            subject=$(git log -1 --format='%s' "$sha")
            author=$(git log -1 --format='%an' "$sha")
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
                   --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$pr" ]; then
              ref="#${pr}"
            else
              ref="[\`${sha:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${sha})"
            fi
            changes="${changes}- ${subject} by @${author} in ${ref}"$'\n'
          done

          {
            echo "## Install"
            echo
            echo "| Editor | Command |"
            echo "| --- | --- |"
            echo "| VS Code | \`code --install-extension blight.glua-gmod\` |"
            echo "| Cursor | \`cursor --install-extension blight.glua-gmod\` |"
            echo "| VSCodium | \`codium --install-extension blight.glua-gmod\` |"
            echo "| Windsurf | \`windsurf --install-extension blight.glua-gmod\` |"
            echo
            echo "Cursor, VSCodium and Windsurf resolve that from [Open VSX](https://open-vsx.org/extension/blight/glua-gmod); VS Code resolves it from the Marketplace."
            echo
            echo "Or install the \`${VSIX}\` attached below, which works in any of them:"
            echo
            echo '```bash'
            echo "code --install-extension ${VSIX}"
            echo '```'
            echo
            echo "In the editor instead: **Extensions** → the \`···\` menu → **Install from VSIX…**"
            echo
            echo "📖 [Full installation guide](https://docs.bluejutzu.dev/glua/installation) · [Documentation](https://docs.bluejutzu.dev/glua) · [Changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/packages/glua-lsp/CHANGELOG.md)"
            echo
            echo "## What's Changed"
            echo
            echo "$changes"
            if [ -n "$previous" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.artifact.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            $([ "${{ steps.tag.outputs.prerelease }}" = "true" ] && echo --prerelease)

      # Publishing is opt-in: without the token the step is skipped, so the
      # GitHub release still happens and nothing fails.
      #
      # It is also non-fatal. The GitHub release is already created by this
      # point, so an expired PAT should leave you with a release to publish by
      # hand, not a red workflow and a half-done tag. The summary says which.
      - name: Publish to the VS Code Marketplace
        id: marketplace
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') && steps.tag.outputs.prerelease != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set, skipping the Marketplace."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm --filter glua-gmod exec vsce publish \
            --no-dependencies \
            --packagePath "../../${{ steps.artifact.outputs.path }}"
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Cursor, VSCodium and Windsurf do not use the Microsoft marketplace.
      - name: Publish to Open VSX
        id: openvsx
        if: startsWith(github.ref, 'refs/tags/') && steps.tag.outputs.prerelease != 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set, skipping Open VSX."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes ovsx publish "${{ steps.artifact.outputs.path }}" --pat "$OVSX_PAT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### ${{ steps.artifact.outputs.name }}"
            echo
            echo "- size: ${{ steps.artifact.outputs.size }}"
            if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
              echo "- released as \`$GITHUB_REF_NAME\`"
              echo "- Marketplace: ${{ steps.marketplace.outcome == 'failure' && '**failed** — publish it by hand' || (steps.marketplace.outputs.published == 'true' && 'published' || 'skipped') }}"
              echo "- Open VSX: ${{ steps.openvsx.outputs.published == 'true' && 'published' || 'skipped' }}"
            else
              echo "- dry run, attached as a workflow artifact only"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release-cli:
    name: Build and publish glua-cli
    if: startsWith(github.ref, 'refs/tags/glua-cli@') || (github.event_name == 'workflow_dispatch' && inputs.package == 'glua-cli')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The version is the tag with its `glua-cli@` prefix stripped, NOT the
      # raw ref name — the package name itself contains a hyphen, so
      # checking the whole ref for "-" to detect a prerelease would always
      # match.
      - name: Check the tag matches the manifest version
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest=$(node -p "require('./packages/glua-cli/package.json').version")
          version="${GITHUB_REF_NAME#glua-cli@}"
          echo "manifest=$manifest tag=$version"
          if [ "$manifest" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $manifest."
            echo "::error::Bump the version in packages/glua-cli/package.json, or retag."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
        env:
          FORCE_COLOR: '1'

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'glua-cli@*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          if [ -n "$previous" ]; then
            range="${previous}..${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
          fi
          shas=$(git log "$range" --no-merges --format='%H' -- packages/glua-cli packages/glua-core)

          changes=""
          for sha in $shas; do
            subject=$(git log -1 --format='%s' "$sha")
            author=$(git log -1 --format='%an' "$sha")
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
                   --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$pr" ]; then
              ref="#${pr}"
            else
              ref="[\`${sha:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${sha})"
            fi
            changes="${changes}- ${subject} by @${author} in ${ref}"$'\n'
          done

          {
            echo "## Install"
            echo
            echo '```bash'
            echo "npm install -g glua-cli"
            echo '```'
            echo
            echo "Gives you the \`glua\` and \`glua-lsp\` binaries — the latter is the same language server the VS Code extension runs, for any editor with an LSP client."
            echo
            echo "📖 [Documentation](https://docs.bluejutzu.dev/glua) · [Changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/packages/glua-cli/CHANGELOG.md)"
            echo
            echo "## What's Changed"
            echo
            echo "$changes"
            if [ -n "$previous" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            $([ "${{ steps.tag.outputs.prerelease }}" = "true" ] && echo --prerelease)

      # No token: npm authenticates this over OIDC against the trusted publisher
      # configured on the package. Non-fatal: the GitHub release is already
      # created by this point, so an expired setup should leave a release to
      # publish by hand, not a red workflow and a half-done tag.
      - name: Publish to npm
        id: npm
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') && steps.tag.outputs.prerelease != 'true'
        working-directory: packages/glua-cli
        run: |
          # Node 22 ships npm 10, which predates OIDC publishing entirely.
          npm install -g npm@^11.5.1
          npm --version

          # Republishing an existing version is an error, not a reason to fail
          # a release that has already been created.
          version=$(node -p "require('./package.json').version")
          if npm view "glua-cli@${version}" version >/dev/null 2>&1; then
            echo "::notice::glua-cli@${version} is already on npm, skipping."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            version=$(node -p "require('./packages/glua-cli/package.json').version")
            echo "### glua-cli@${version}"
            echo
            if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
              echo "- released as \`$GITHUB_REF_NAME\`"
              echo "- npm: ${{ steps.npm.outcome == 'failure' && '**failed** — publish it by hand' || (steps.npm.outputs.published == 'true' && 'published' || 'skipped') }}"
            else
              echo "- dry run, nothing published"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
