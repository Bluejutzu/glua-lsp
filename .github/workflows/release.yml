name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package without creating a release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to generate release notes from the commits since last tag.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A tag that disagrees with the manifest produces a release whose
      # filename and contents do not match its name. Fail early instead.
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./packages/glua-lsp/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "manifest=$manifest tag=$tag"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $manifest."
            echo "::error::Bump the version in packages/glua-lsp/package.json, or retag."
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      # Before the tests: the CLI's tests exercise its built bundle.
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
        env:
          FORCE_COLOR: '1'

      - name: Package
        run: pnpm run package

      - name: Resolve artifact
        id: artifact
        run: |
          # Name it explicitly rather than globbing: a stray .vsix in the tree
          # would otherwise be picked up and published in place of the build.
          version=$(node -p "require('./packages/glua-lsp/package.json').version")
          vsix="packages/glua-lsp/glua-lsp-${version}.vsix"
          if [ ! -f "$vsix" ]; then
            echo "::error::Expected $vsix, but packaging did not produce it."
            ls -la packages/glua-lsp/*.vsix || true
            exit 1
          fi
          echo "path=$vsix" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$vsix")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$vsix" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: ${{ steps.artifact.outputs.name }}
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          # GitHub's own generator builds this list from merged pull requests,
          # so it produces nothing for a commit pushed straight to main. Same
          # shape, but a commit that has no PR links its hash instead.
          jqline='[.sha, (.commit.message | split("\n")[0]), (.author.login // .commit.author.name)] | @tsv'
          if [ -n "$previous" ]; then
            raw=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}" \
              --jq ".commits[] | select((.parents | length) < 2) | ${jqline}")
          else
            raw=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits?sha=${GITHUB_REF_NAME}&per_page=100" \
              --jq ".[] | select((.parents | length) < 2) | ${jqline}")
          fi

          changes=""
          while IFS=$'\t' read -r sha subject author; do
            [ -z "$sha" ] && continue
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
                   --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$pr" ]; then
              ref="#${pr}"
            else
              ref="[\`${sha:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${sha})"
            fi
            changes="${changes}- ${subject} by @${author} in ${ref}"$'\n'
          done <<< "$raw"

          {
            echo "## Install"
            echo
            echo "| Editor | Command |"
            echo "| --- | --- |"
            echo "| VS Code | \`code --install-extension bluejutzu.glua-lsp\` |"
            echo "| Cursor | \`cursor --install-extension bluejutzu.glua-lsp\` |"
            echo "| VSCodium | \`codium --install-extension bluejutzu.glua-lsp\` |"
            echo "| Windsurf | \`windsurf --install-extension bluejutzu.glua-lsp\` |"
            echo
            echo "Cursor, VSCodium and Windsurf resolve that from"
            echo "[Open VSX](https://open-vsx.org/extension/bluejutzu/glua-lsp);"
            echo "VS Code resolves it from the Marketplace."
            echo
            echo "Or install the \`${VSIX}\` attached below, which works in any of them:"
            echo
            echo '```bash'
            echo "code --install-extension ${VSIX}"
            echo '```'
            echo
            echo "In the editor instead: **Extensions** → the \`···\` menu → **Install from VSIX…**"
            echo
            echo "📖 [Full installation guide](https://glua.bluejutzu.dev/installation)"
            echo " · [Documentation](https://glua.bluejutzu.dev)"
            echo " · [Changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/packages/glua-lsp/CHANGELOG.md)"
            echo
            echo "## What's Changed"
            echo
            echo "$changes"
            if [ -n "$previous" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.artifact.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

      # Publishing is opt-in: without the token the step is skipped, so the
      # GitHub release still happens and nothing fails.
      #
      # It is also non-fatal. The GitHub release is already created by this
      # point, so an expired PAT should leave you with a release to publish by
      # hand, not a red workflow and a half-done tag. The summary says which.
      - name: Publish to the VS Code Marketplace
        id: marketplace
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set, skipping the Marketplace."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm --filter glua-lsp exec vsce publish \
            --no-dependencies \
            --packagePath "../../${{ steps.artifact.outputs.path }}"
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Cursor, VSCodium and Windsurf do not use the Microsoft marketplace.
      - name: Publish to Open VSX
        id: openvsx
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set, skipping Open VSX."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes ovsx publish "${{ steps.artifact.outputs.path }}" --pat "$OVSX_PAT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### ${{ steps.artifact.outputs.name }}"
            echo
            echo "- size: ${{ steps.artifact.outputs.size }}"
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "- released as \`$GITHUB_REF_NAME\`"
              echo "- Marketplace: ${{ steps.marketplace.outcome == 'failure' && '**failed** — publish it by hand' || (steps.marketplace.outputs.published == 'true' && 'published' || 'skipped') }}"
              echo "- Open VSX: ${{ steps.openvsx.outputs.published == 'true' && 'published' || 'skipped' }}"
            else
              echo "- dry run, attached as a workflow artifact only"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
