name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package without creating a release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to generate release notes from the commits since last tag.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A tag that disagrees with the manifest produces a release whose
      # filename and contents do not match its name. Fail early instead.
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest=$(node -p "require('./packages/glua-lsp/package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "manifest=$manifest tag=$tag"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $manifest."
            echo "::error::Bump the version in packages/glua-lsp/package.json, or retag."
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test
        env:
          FORCE_COLOR: '1'

      - name: Build
        run: pnpm run build

      - name: Package
        run: pnpm run package

      - name: Resolve artifact
        id: artifact
        run: |
          # Name it explicitly rather than globbing: a stray .vsix in the tree
          # would otherwise be picked up and published in place of the build.
          version=$(node -p "require('./packages/glua-lsp/package.json').version")
          vsix="packages/glua-lsp/glua-lsp-${version}.vsix"
          if [ ! -f "$vsix" ]; then
            echo "::error::Expected $vsix, but packaging did not produce it."
            ls -la packages/glua-lsp/*.vsix || true
            exit 1
          fi
          echo "path=$vsix" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$vsix")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$vsix" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "code --install-extension ${{ steps.artifact.outputs.name }}"
            echo '```'
            echo
            echo "Download the \`.vsix\` below, then run that from the folder you saved it in."
            echo "Cursor keeps a separate extension directory, so use \`cursor --install-extension\` there."
            echo
            echo "Full documentation: <https://glua.bluejutzu.dev>"
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous..${GITHUB_REF_NAME}"
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/$previous...${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s'
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.artifact.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

      # Publishing is opt-in: without the token the step is skipped, so the
      # GitHub release still happens and nothing fails.
      - name: Publish to the VS Code Marketplace
        id: marketplace
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set, skipping the Marketplace."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm --filter glua-lsp exec vsce publish \
            --no-dependencies \
            --packagePath "../../${{ steps.artifact.outputs.path }}"
          echo "published=true" >> "$GITHUB_OUTPUT"

      # Cursor, VSCodium and Windsurf do not use the Microsoft marketplace.
      - name: Publish to Open VSX
        id: openvsx
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set, skipping Open VSX."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes ovsx publish "${{ steps.artifact.outputs.path }}" --pat "$OVSX_PAT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### ${{ steps.artifact.outputs.name }}"
            echo
            echo "- size: ${{ steps.artifact.outputs.size }}"
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "- released as \`$GITHUB_REF_NAME\`"
              echo "- Marketplace: ${{ steps.marketplace.outputs.published == 'true' && 'published' || 'skipped' }}"
              echo "- Open VSX: ${{ steps.openvsx.outputs.published == 'true' && 'published' || 'skipped' }}"
            else
              echo "- dry run, attached as a workflow artifact only"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
