name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Before the tests: the CLI's tests exercise its built bundle.
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
        env:
          # The reporter honours NO_COLOR; Actions renders ANSI fine.
          FORCE_COLOR: '1'

      # The linter run against its own deliberately-broken example addon. The
      # findings are expected, so only a crash should fail the build.
      - name: Lint the example addon
        run: pnpm run lint:example -- --format github || true

      - name: Package
        run: pnpm run package

      # Lets you install the exact build from any commit without tagging it.
      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: glua-lsp-vsix-${{ github.sha }}
          path: packages/glua-lsp/*.vsix
          if-no-files-found: error
          retention-days: 14
